fields:
  # Categories
  - collection: categories
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: categories
    field: status
    type: string
    schema:
      default_value: published
    meta:
      width: half
      interface: select-dropdown
      options:
        choices:
          - text: Published
            value: published
          - text: Draft
            value: draft
          - text: Archived
            value: archived
  - collection: categories
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: categories
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: categories
    field: name
    type: string
    schema: {}
    meta:
      interface: input
      width: half
      required: true
  - collection: categories
    field: slug
    type: string
    schema:
      is_unique: true
    meta:
      interface: input
      width: half
      required: true
  - collection: categories
    field: description
    type: text
    schema: {}
    meta:
      interface: input-multiline
      width: full
  - collection: categories
    field: parent_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: categories
      foreign_key_column: id
      on_delete: SET NULL
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: categories
    field: children
    type: alias
    schema: null
    meta:
      interface: list-o2m
      special: [o2m]
      width: full

  # Products
  - collection: products
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: products
    field: status
    type: string
    schema:
      default_value: published
    meta:
      width: half
      interface: select-dropdown
      options:
        choices:
          - text: Published
            value: published
          - text: Draft
            value: draft
          - text: Archived
            value: archived
  - collection: products
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: products
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: products
    field: sku
    type: string
    schema:
      is_unique: true
    meta:
      interface: input
      width: half
      required: true
  - collection: products
    field: name
    type: string
    schema: {}
    meta:
      interface: input
      width: half
      required: true
  - collection: products
    field: slug
    type: string
    schema:
      is_unique: true
    meta:
      interface: input
      width: half
      required: true
  - collection: products
    field: description
    type: text
    schema: {}
    meta:
      interface: input-rich-text-html
      width: full
  - collection: products
    field: category_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: categories
      foreign_key_column: id
      on_delete: SET NULL
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: products
    field: attributes
    type: alias
    schema: null
    meta:
      interface: list-o2m
      special: [o2m]
      width: full

  # Attributes
  - collection: attributes
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: attributes
    field: status
    type: string
    schema:
      default_value: published
    meta:
      width: half
      interface: select-dropdown
      options:
        choices:
          - text: Published
            value: published
          - text: Draft
            value: draft
          - text: Archived
            value: archived
  - collection: attributes
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: attributes
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: attributes
    field: name
    type: string
    schema: {}
    meta:
      interface: input
      width: half
      required: true
  - collection: attributes
    field: key
    type: string
    schema:
      is_unique: true
    meta:
      interface: input
      width: half
      required: true
      note: "Unique key for code reference (e.g. material, length)"
  - collection: attributes
    field: type
    type: string
    schema: {}
    meta:
      interface: select-dropdown
      width: half
      options:
        choices:
          - text: Text
            value: text
          - text: Number
            value: number
          - text: Boolean
            value: boolean
  - collection: attributes
    field: unit
    type: string
    schema: {}
    meta:
      interface: input
      width: half
      note: "e.g. mm, kg"
  - collection: attributes
    field: is_facet
    type: boolean
    schema:
      default_value: false
    meta:
      interface: boolean
      width: half
      note: "Use for search filtering"

  # Product Attribute Values
  - collection: product_attribute_values
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: product_attribute_values
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: product_attribute_values
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: product_attribute_values
    field: product_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: products
      foreign_key_column: id
      on_delete: CASCADE
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: product_attribute_values
    field: attribute_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: attributes
      foreign_key_column: id
      on_delete: CASCADE
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: product_attribute_values
    field: value_text
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: product_attribute_values
    field: value_number
    type: float
    schema: {}
    meta:
      interface: input
      width: half

  # Inquiries
  - collection: inquiries
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: inquiries
    field: status
    type: string
    schema:
      default_value: published
    meta:
      width: half
      interface: select-dropdown
      options:
        choices:
          - text: New
            value: new
          - text: Processing
            value: processing
          - text: Closed
            value: closed
          - text: Archived
            value: archived
  - collection: inquiries
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: inquiries
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: inquiries
    field: customer_name
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: inquiries
    field: email
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: inquiries
    field: company
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: inquiries
    field: country
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: inquiries
    field: message
    type: text
    schema: {}
    meta:
      interface: input-multiline
      width: full
  - collection: inquiries
    field: ip_address
    type: string
    schema: {}
    meta:
      interface: input
      width: half
      readonly: true
  - collection: inquiries
    field: items
    type: alias
    schema: null
    meta:
      interface: list-o2m
      special: [o2m]
      width: full

  # Inquiry Items
  - collection: inquiry_items
    field: id
    type: uuid
    schema:
      is_primary_key: true
      has_auto_increment: false
    meta:
      hidden: true
      interface: input
      readonly: true
      special: [uuid]
  - collection: inquiry_items
    field: date_created
    type: timestamp
    schema: {}
    meta:
      special: [date-created]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: inquiry_items
    field: date_updated
    type: timestamp
    schema: {}
    meta:
      special: [date-updated]
      interface: datetime
      readonly: true
      hidden: true
      width: half
  - collection: inquiry_items
    field: inquiry_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: inquiries
      foreign_key_column: id
      on_delete: CASCADE
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: inquiry_items
    field: product_id
    type: uuid
    schema:
      is_nullable: true
      foreign_key_table: products
      foreign_key_column: id
      on_delete: SET NULL
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      width: half
  - collection: inquiry_items
    field: quantity
    type: integer
    schema:
      default_value: 1
    meta:
      interface: input
      width: half
  - collection: inquiry_items
    field: target_price
    type: string
    schema: {}
    meta:
      interface: input
      width: half
  - collection: inquiry_items
    field: remark
    type: text
    schema: {}
    meta:
      interface: input-multiline
      width: full

relations:
  - collection: categories
    field: parent_id
    related_collection: categories
    schema:
      on_delete: SET NULL
    meta:
      one_field: children
      sort_field: null
      one_deselect_action: nullify
      one_cascade_delete: false
      one_allowed_collections: null
  - collection: products
    field: category_id
    related_collection: categories
    schema:
      on_delete: SET NULL
    meta:
      one_field: null
      sort_field: null
      one_deselect_action: nullify
      one_cascade_delete: false
      one_allowed_collections: null
  - collection: product_attribute_values
    field: product_id
    related_collection: products
    schema:
      on_delete: CASCADE
    meta:
      one_field: attributes
      sort_field: null
      one_deselect_action: delete
