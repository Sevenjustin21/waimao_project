  - collection: inquiry_items
    field: inquiry_id
    related_collection: inquiries
    schema:
      on_delete: CASCADE
    meta:
      one_field: items
      sort_field: null
      one_deselect_action: delete
      one_cascade_delete: true
      one_allowed_collections: null
  - collection: inquiry_items
    field: product_id
    related_collection: products
    schema:
      on_delete: SET NULL
    meta:
      one_field: null
      sort_field: null
      one_deselect_action: nullify
      one_cascade_delete: false
      one_allowed_collections: null
